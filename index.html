<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SHORE DASH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameWrapper">
    <canvas id="c" aria-label="Shore Dash 3D game"></canvas>

    <div id="ui" aria-hidden="true">
      <div id="scoreDisplay">0</div>
      <div id="livesDisplay">
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
      </div>
    </div>

    <div id="comboDisplay" aria-live="polite">NICE! ×2</div>

    <div id="overlay">
      <h1>SHORE DASH</h1>
      <div class="subtitle">3D Endless Beach Runner</div>
      <div class="final-score" id="finalScore">SCORE: 0</div>
      <button id="startBtn" type="button">CATCH A WAVE</button>
      <div class="hint">TAP = JUMP • SWIPE ↑ = JUMP • SWIPE ↓ = SLIDE • SWIPE ← → = DODGE</div>
    </div>
  </div>

  <script src="orientation-fix.js"></script>
  <script type="module" src="game-3d.js"></script>
</body>
</html>
